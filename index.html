<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Form</title>
    <!-- css file -->
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Details</h1>
    <div class="container">
    <form id="studentForm">
       <!-- Student Name -->
      <label for="name">Student Name: </label>
      <input type="text" id="name" name="name" placeholder="Enter student name" required>
      <br>
      <br>
      <!-- Roll Number -->
      <label for="roll">Roll Number: </label>
      <input type="text" id="roll" name="roll" placeholder="Enter roll number" required>
      <br>
      <br>
      <!-- course Selection -->
      <label for="course">Course: </label>
      <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="CSE">B.tech CSE</option>
        <option value="IT">B.tech IT</option>
        <option value="ECE">B.tech ECE</option>
        <option value="ME">B.tech ME</option>
        <option value="CE">B.tech CE</option>
        <option value="MCA">MCA</option>
        <option value="BCA">BCA</option>
      </select>
      <br>
      <br>
      <!-- Year Selection -->
      <label for="year">Year: </label>
      <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="1st">1st Year</option>
        <option value="2nd">2nd Year</option>
        <option value="3rd">3rd Year</option>
        <option value="4th">4th Year</option>
      </select>
      <br>
      <br>
      <!-- CGPA -->
      <label for="cgpa">Current CGPA: </label>
      <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="10" placeholder="Enter CGPA" required>
      <br>
      <br>
      <!-- Submit Button -->
      <button id="btn" type="submit">Submit</button>
    </form>
  </div>
  <br>
    <div id="ans"></b></div>


  <!-- External JS File -->
  <script src="script.js"></script>

</body>
</html>
